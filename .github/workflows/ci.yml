name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.9.26'
  # Matches compose.yaml; services below publish PostgreSQL on this host port.
  DATABASE_URL: postgresql+psycopg://upcycling:upcycling@localhost:55432/upcycling

jobs:
  backend:
    name: Backend (lint, types, tests, migrations)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: upcycling
          POSTGRES_PASSWORD: upcycling
          POSTGRES_DB: upcycling
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U upcycling" --health-interval 2s --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Migration CLI round trip and drift check
        env:
          UPCYCLING_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Dependency audit (runtime dependencies, all severities)
        run: |
          uv export --locked --no-dev --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --disable-pip

  frontend:
    name: Frontend (format, lint, types, locales, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @upcycling/expert-pwa check:locales
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (runtime dependencies, all severities)
        run: pnpm audit --prod
      - name: Dependency audit (build/test tooling, moderate and above)
        run: pnpm audit --audit-level moderate

  contract:
    name: API contract (OpenAPI + generated client up to date)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-contract.sh

  e2e:
    name: End-to-end (Chromium + WebKit/iPhone emulation)
    needs: [backend, frontend, contract]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: upcycling
          POSTGRES_PASSWORD: upcycling
          POSTGRES_DB: upcycling
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U upcycling" --health-interval 2s --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.33
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @upcycling/expert-pwa exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @upcycling/expert-pwa test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/expert-pwa/playwright-report
          retention-days: 7

  docker:
    name: Backend image (build + smoke test)
    needs: [backend]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: upcycling
          POSTGRES_PASSWORD: upcycling
          POSTGRES_DB: upcycling
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U upcycling" --health-interval 2s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          push: false
          tags: upcycling-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        env:
          IMAGE: upcycling-backend:ci
          SKIP_BUILD: '1'
          SMOKE_DATABASE_URL: postgresql+psycopg://upcycling:upcycling@host.docker.internal:55432/upcycling
        run: ./scripts/docker-smoke.sh
